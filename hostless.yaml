build:
  system: docker
  min_cpu: 0.5
  max_cpu: 1
  min_memory: 512
  max_memory: 8192

dockerfile_path: "./Dockerfile"
working_directory: "/"
build_context_directory: "/"
start_command: "node server.mjs"

scaling:
  min_replicas: 1
  max_replicas: 1
  min_cpu: 0.01
  max_cpu: 0.1
  min_memory: 128
  max_memory: 256

health_check:
  type: http
  http_path: "/health"
  interval_in_seconds: 60
